name: eval-nightly

# Paid model calls. Off until the repository variable EVAL_NIGHTLY_ENABLED is "true"
# and the ANTHROPIC_API_KEY, OPENAI_API_KEY and GEMINI_API_KEY secrets exist.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  canary:
    if: vars.EVAL_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: packages/eval
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run legallabs-eval run --system bm25-local --suite retrieval-golden
      # A small sample each night; the full suites run before a release.
      - run: uv run legallabs-eval run --system claude-plain --suite extract-cuad --limit 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: uv run legallabs-eval run --system claude-plain --suite nli-contractnli --limit 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-runs
          # Scores only: the traces hold dataset text, which we must not redistribute.
          path: |
            packages/eval/runs/*/summary.json
            packages/eval/runs/*/run_config.json
          retention-days: 30
