name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      TEST_CLAMD_HOST: 127.0.0.1
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      # The backup tests dump the Postgres 17 service, which needs its own pg_dump.
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      # A service container can't take arguments, and SeaweedFS needs `server -s3`.
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs:4.53 server -s3 -dir=/data
      # Started early: ClamAV loads its signatures while dependencies install.
      - run: docker run -d -p 3310:3310 clamav/clamav:1.4
      # Run restarts are proven against a real Temporal server, not a mock.
      - run: docker run -d -p 7233:7233 temporalio/temporal:1.10.1 server start-dev --ip 0.0.0.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: timeout 60 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8333; do sleep 1; done'
      - run: timeout 120 sh -c 'until nc -z 127.0.0.1 7233; do sleep 2; done'
      - run: timeout 300 sh -c 'until printf "zPING\0" | nc -w 2 127.0.0.1 3310 | grep -q PONG; do sleep 5; done'
      - run: pnpm test
      - run: pnpm build
      # The published API spec is generated from the code; a stale copy fails here.
      - run: pnpm --filter @legallabs/api openapi:check
      # Pilot acceptance: a clean stack, driven end to end through the API.
      - run: pnpm --filter @legallabs/api test:e2e
        env:
          PILOT_S3_ENDPOINT: http://127.0.0.1:8333
      - run: pnpm --filter @legallabs/ui build-storybook

  # Kept apart so the main job stays fast: this one boots a real Zitadel and signs in through it.
  identity-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -m 777 .zitadel && docker compose -p legallabs-zitadel -f compose.zitadel.yaml up -d
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@legallabs/api...
      # The script waits for Zitadel itself, so the image pull and first-run setup overlap the build.
      - run: node scripts/zitadel-bootstrap.mjs >> "$GITHUB_ENV"
      - run: pnpm --filter @legallabs/api exec vitest run src/auth/oidc/oidc.zitadel.test.ts
      - if: failure()
        run: docker compose -p legallabs-zitadel -f compose.zitadel.yaml logs --tail 200 zitadel

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/eval
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      # playbook-review runs node/run.ts against the built review, docx and contracts packages.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@legallabs/eval..."
      - run: pnpm --filter "@legallabs/eval^..." build
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # The offline baseline needs no keys, so every PR proves a run still ends in summary.json.
      - run: uv run legallabs-eval run --system bm25-local --suite retrieval-golden
      # Canned replies: proves generation, review, scoring and OOXML checks run; scores mean nothing.
      - run: uv run legallabs-eval run --system playbook-fake --suite playbook-review --fail-on-task-errors

  docproc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/docproc
    env:
      DOCPROC_MODELS_DIR: ${{ github.workspace }}/.docproc-models
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocrmypdf tesseract-ocr
      - run: uv sync --frozen
      - uses: actions/cache@v5
        with:
          path: .docproc-models
          key: docproc-models-${{ hashFiles('services/docproc/uv.lock') }}
      - run: uv run python -m docproc.prefetch
      - run: uv run pytest

  # SAML via Zitadel (SEC-005): a test SAML IdP, Zitadel as its SP, driven headlessly end to end.
  identity-saml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZITADEL_SAML_ISSUER: http://localhost:55436
    steps:
      - uses: actions/checkout@v7
      - run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f compose.zitadel-saml.yaml up -d
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @legallabs/api...
      - run: node scripts/zitadel-saml-bootstrap.mjs
      - run: pnpm --filter @legallabs/api exec vitest run --config vitest.saml.config.ts
      - if: failure()
        run: docker compose -f compose.zitadel-saml.yaml logs --tail 200
