name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
    steps:
      - uses: actions/checkout@v7
      # A service container can't take arguments, and SeaweedFS needs `server -s3`.
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs:4.53 server -s3 -dir=/data
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: timeout 60 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8333; do sleep 1; done'
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @legallabs/ui build-storybook

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/eval
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # The offline baseline needs no keys, so every PR proves a run still ends in summary.json.
      - run: uv run legallabs-eval run --system bm25-local --suite retrieval-golden

  docproc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/docproc
    env:
      DOCPROC_MODELS_DIR: ${{ github.workspace }}/.docproc-models
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocrmypdf tesseract-ocr
      - run: uv sync --frozen
      - uses: actions/cache@v5
        with:
          path: .docproc-models
          key: docproc-models-${{ hashFiles('services/docproc/uv.lock') }}
      - run: uv run python -m docproc.prefetch
      - run: uv run pytest
