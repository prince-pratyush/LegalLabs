[project]
name = "legallabs-eval"
version = "0.0.0"
description = "Evaluation harness for LegalLabs"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29"]

[project.scripts]
legallabs-eval = "legallabs_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legallabs_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
