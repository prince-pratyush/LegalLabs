# Named systems the harness can evaluate. Secrets never go here: each system reads
# its credentials from environment variables.

# Our stack, reached over its HTTP API. Needs LEGALLABS_URL, LEGALLABS_WORKSPACE,
# LEGALLABS_EMAIL and LEGALLABS_PASSWORD for an account in a workspace kept for evals.
[systems.legallabs-keyword]
harness = "legallabs-search"
vendor = "legallabs"
# List every model vendor the stack calls underneath, so none of them judges it.
vendors = ["legallabs"]
params = { search_params = {} }

# Our threads over HTTP: ask, wait for the verified answer, approve deep-analysis plans.
# Same env as above; rooms over 50 files need a preloaded vault in LEGALLABS_VAULT_ID.
# The server picks the model, so vendors must match the server's configured providers.
[systems.legallabs-threads]
harness = "legallabs-thread"
vendor = "legallabs"
vendors = ["legallabs", "ollama"]
params = { poll_seconds = 1.0, run_timeout_seconds = 1800 }

# The same stack with a paid model configured on the server (ANTHROPIC_API_KEY there).
[systems.legallabs-threads-anthropic]
harness = "legallabs-thread"
vendor = "legallabs"
vendors = ["legallabs", "anthropic"]
params = { poll_seconds = 1.0, run_timeout_seconds = 3600 }

# Public-law search over the same API, for the retrieval-golden-<source> suites.
# Same credentials; the sources must be synced first (legallabs-knowledge sync).
[systems.legallabs-knowledge]
harness = "legallabs-knowledge"
vendor = "legallabs"
vendors = ["legallabs"]
params = { search_params = {} }

# Offline lexical baseline: no server, no keys. CI runs it.
[systems.bm25-local]
harness = "bm25"
vendor = "local"
params = { k1 = 1.2, b = 0.75 }

# Plain-model baselines: the whole document and the question, nothing else.
[systems.claude-plain]
harness = "model"
vendor = "anthropic"
params = { model = "claude-sonnet-5-5", max_tokens = 2048 }

[systems.gpt-plain]
harness = "model"
vendor = "openai"
params = { model = "gpt-5.5", max_tokens = 2048 }

# Model plus naive RAG: only the top BM25 chunks of the document.
[systems.claude-naive-rag]
harness = "naive-rag"
vendor = "anthropic"
params = { model = "claude-sonnet-5-5", max_tokens = 2048, top_k = 8 }

# Judges grade answer suites: two per criterion, from distinct vendors the system
# doesn't use. Keys: OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY.
[judges.gpt]
vendor = "openai"
model = "gpt-5.5"

[judges.claude]
vendor = "anthropic"
model = "claude-sonnet-5-5"

[judges.gemini]
vendor = "google"
model = "gemini-2.5-pro"

[grading]
judges_per_criterion = 2
