# Named systems the harness can evaluate. Secrets never go here: each system reads
# its credentials from environment variables.

# Our stack, reached over its HTTP API. Needs LEGALLABS_URL, LEGALLABS_WORKSPACE,
# LEGALLABS_EMAIL and LEGALLABS_PASSWORD for an account in a workspace kept for evals.
[systems.legallabs-keyword]
harness = "legallabs-search"
vendor = "legallabs"
# List every model vendor the stack calls underneath, so none of them judges it.
vendors = ["legallabs"]
params = { search_params = {} }

# Our threads over HTTP: ask, wait for the verified answer, approve deep-analysis plans.
# Same env as above; rooms over 50 files need a preloaded vault in LEGALLABS_VAULT_ID.
# The server picks the model, so vendors must match the server's configured providers.
[systems.legallabs-threads]
harness = "legallabs-thread"
vendor = "legallabs"
vendors = ["legallabs", "ollama"]
params = { poll_seconds = 1.0, run_timeout_seconds = 1800 }

# The same stack with a paid model configured on the server (ANTHROPIC_API_KEY there).
[systems.legallabs-threads-anthropic]
harness = "legallabs-thread"
vendor = "legallabs"
vendors = ["legallabs", "anthropic"]
params = { poll_seconds = 1.0, run_timeout_seconds = 3600 }

# Public-law search over the same API, for the retrieval-golden-<source> suites.
# Same credentials; the sources must be synced first (legallabs-knowledge sync).
[systems.legallabs-knowledge]
harness = "legallabs-knowledge"
vendor = "legallabs"
vendors = ["legallabs"]
params = { search_params = {} }

# Offline lexical baseline: no server, no keys. CI runs it.
[systems.bm25-local]
harness = "bm25"
vendor = "local"
params = { k1 = 1.2, b = 0.75 }

# Plain-model baselines: the whole document and the question, nothing else.
[systems.claude-plain]
harness = "model"
vendor = "anthropic"
params = { model = "claude-sonnet-5-5", max_tokens = 2048 }

[systems.gpt-plain]
harness = "model"
vendor = "openai"
params = { model = "gpt-5.5", max_tokens = 2048 }

# Model plus naive RAG: only the top BM25 chunks of the document.
[systems.claude-naive-rag]
harness = "naive-rag"
vendor = "anthropic"
params = { model = "claude-sonnet-5-5", max_tokens = 2048, top_k = 8 }

# Review tables over HTTP: upload, create a table, add columns, run, read cells back.
# Same env as above; more than 50 documents need a preloaded vault in LEGALLABS_VAULT_ID.
[systems.legallabs-review-table]
harness = "legallabs-review-table"
vendor = "legallabs"
vendors = ["legallabs", "ollama"]
params = { poll_seconds = 2.0, table_timeout_seconds = 7200 }

# The local model, free and offline (Ollama on localhost or OLLAMA_BASE_URL). The
# window matches the gateway's 4k route, so the cell harness reads what the API would.
[systems.qwen-plain]
harness = "model"
vendor = "ollama"
params = { model = "qwen3:4b-instruct", max_tokens = 512, context_tokens = 4096, max_context_chars = 10000 }

# Review-table cells without the server: cell prompt, citations, local quote checks.
[systems.qwen-cell]
harness = "review-cell"
vendor = "ollama"
params = { model = "qwen3:4b-instruct", max_tokens = 512, context_tokens = 4096 }

# The same cell harness on a paid model, with a window big enough to read most contracts whole.
[systems.claude-cell]
harness = "review-cell"
vendor = "anthropic"
params = { model = "claude-sonnet-5-5", max_tokens = 1024, context_tokens = 100000 }
# Playbook review (playbook-review suite): node/run.ts per contract, needing Node 22.18+
# and the workspace packages built (pnpm --filter '@legallabs/eval^...' build).
# Offline and free: replies are canned, so its scores only prove the pipeline runs. CI runs it.
[systems.playbook-fake]
harness = "playbook-node"
vendor = "local"
params = { client = "fake" }

# The local model through Ollama (OLLAMA_BASE_URL, default http://localhost:11434). A small
# machine needs the long timeouts and one contract at a time: pass --concurrency 1.
[systems.playbook-ollama]
harness = "playbook-node"
vendor = "ollama"
params = { client = "ollama", model = "qwen3:4b-instruct", parallelism = 1, num_ctx = 8192, rule_timeout_ms = 600000, call_timeout_ms = 600000, task_timeout_seconds = 14400 }

# The model gateway's Anthropic route (ANTHROPIC_API_KEY); it routes only claude-haiku-5-5.
[systems.playbook-gateway-haiku]
harness = "playbook-node"
vendor = "anthropic"
params = { client = "gateway", model = "anthropic/claude-haiku-5-5", parallelism = 8 }

# Direct calls for models the gateway does not route (ANTHROPIC_API_KEY, OPENAI_API_KEY).
[systems.playbook-claude-sonnet]
harness = "playbook-node"
vendor = "anthropic"
params = { client = "anthropic", model = "claude-sonnet-5-5", parallelism = 8 }

[systems.playbook-gpt]
harness = "playbook-node"
vendor = "openai"
params = { client = "openai", model = "gpt-5.5", parallelism = 8 }

# Judges grade answer suites: two per criterion, from distinct vendors the system
# doesn't use. Keys: OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY.
[judges.gpt]
vendor = "openai"
model = "gpt-5.5"

[judges.claude]
vendor = "anthropic"
model = "claude-sonnet-5-5"

[judges.gemini]
vendor = "google"
model = "gemini-2.5-pro"

[grading]
judges_per_criterion = 2
