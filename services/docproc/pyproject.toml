[project]
name = "docproc"
version = "0.1.0"
description = "Parses untrusted files into pages with exact text offsets"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "docling>=2.150.0",
    "extract-msg>=0.58.2",
    "fastapi>=0.162.5",
    "libpff-python>=20261030",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.33",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docproc"]

# CPU-only torch on Linux keeps the image small; macOS wheels have no CUDA anyway.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
]
